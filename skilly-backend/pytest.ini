[pytest]
# config.settings_test fuerza SQLite en memoria: los tests no dependen de un
# MariaDB levantado. Ver config/settings_test.py.
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = test_*.py
testpaths = apps config
addopts = -ra --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning:django.*
markers =
    auth: pruebas de autenticacion y permisos
    pagos: pruebas de la maquina de estados del pago
    reservas: pruebas de la maquina de estados de la reserva