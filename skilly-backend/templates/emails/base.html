<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Skilly Latam{% endblock %}</title>
</head>
<body style="margin:0;padding:24px;background:#f5f5f5;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1f2933;">
    <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px;">
        <p style="margin:0 0 24px;font-size:20px;font-weight:700;color:#0b7285;">Skilly Latam</p>
        {% block contenido %}{% endblock %}
        <p style="margin:32px 0 0;padding-top:16px;border-top:1px solid #e4e4e7;font-size:12px;color:#6b7280;">
            Este es un correo automático. No lo respondas directamente.
        </p>
    </div>
</body>
</html>
